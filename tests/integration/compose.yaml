# The servers of the integration tests:
#
#   docker compose -f tests/integration/compose.yaml up -d --wait
#   DUBBO_TEST_ZOOKEEPER=127.0.0.1:2181 DUBBO_TEST_NACOS=127.0.0.1:8848 .venv/bin/python -m pytest
#   docker compose -f tests/integration/compose.yaml down -v
#
# The tags and host ports come from the variables below. A Nacos client reaches
# gRPC at the HTTP port plus 1000, so NACOS_GRPC_PORT keeps that offset.

name: dubbo-test

services:
  zookeeper:
    image: zookeeper:${ZOOKEEPER_TAG:-3.9.5}
    ports:
      - 127.0.0.1:${ZOOKEEPER_PORT:-2181}:2181
    healthcheck:
      test: [CMD, zkServer.sh, status]
      interval: 2s
      timeout: 5s
      retries: 30

  nacos:
    image: nacos/nacos-server:${NACOS_TAG:-v2.4.3}
    environment:
      MODE: standalone
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - 127.0.0.1:${NACOS_PORT:-8848}:8848
      - 127.0.0.1:${NACOS_GRPC_PORT:-9848}:9848
    healthcheck:
      test: [CMD-SHELL, curl -fs http://localhost:8848/nacos/v1/console/health/readiness && nc -z localhost 9848]
      interval: 2s
      timeout: 5s
      retries: 60
