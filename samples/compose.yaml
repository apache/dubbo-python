# The registries the samples use:
#
#   docker compose -f samples/compose.yaml up -d --wait
#   docker compose -f samples/compose.yaml down
#
# ZooKeeper listens on 127.0.0.1:2181 and Nacos on 127.0.0.1:8848. A Nacos
# client also reaches Nacos over gRPC on port 9848.

name: dubbo-samples

services:
  zookeeper:
    image: zookeeper:3.9.5
    ports:
      - 127.0.0.1:2181:2181
    healthcheck:
      test: [CMD, zkServer.sh, status]
      interval: 2s
      timeout: 5s
      retries: 30

  nacos:
    image: nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
    ports:
      - 127.0.0.1:8848:8848
      - 127.0.0.1:9848:9848
    healthcheck:
      test: [CMD-SHELL, curl -fs http://localhost:8848/nacos/v1/console/health/readiness && nc -z localhost 9848]
      interval: 2s
      timeout: 5s
      retries: 60
