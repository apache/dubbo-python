# A plugin that teaches Apache Dubbo for Python to read TOML configuration
# files. Installing it is enough: the entry point below names the parser, and
# the framework finds it by the suffix of a file, .toml.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dubbo-toml"
version = "0.1.0"
description = "TOML configuration files for Apache Dubbo for Python"
requires-python = ">=3.11"
dependencies = ["apache-dubbo"]

# The group is the extension point, and the name the extension.
[project.entry-points."apache_dubbo.config.parser"]
toml = "dubbo_toml:TomlParser"
