# The configuration of server.py. Each section is a configuration class of
# dubbo.config, such as ApplicationConfig for `application`, and each key one
# of its fields.

application:
  name: configuration-server
  version: 1.0.0
  # Shown to registries and governance tools.
  owner: samples
  environment: develop

protocols:
  dubbo:
    port: 20880

registries:
  zookeeper:
    address: zookeeper://127.0.0.1:2181

# Defaults for every service this application provides.
provider:
  # Seconds a call may take. Consumers take it from the registry when they
  # set none themselves.
  timeout: 1
  # Log each call at INFO.
  accesslog: true
  # Settings of one service, by its name, over the defaults above.
  services:
    org.apache.dubbo.samples.Greeter:
      methods:
        greet_slowly:
          timeout: 5

shutdown:
  # Seconds the services keep serving after they leave the registries.
  unregister_wait: 1
  # Seconds stopping may take in all.
  grace: 10
