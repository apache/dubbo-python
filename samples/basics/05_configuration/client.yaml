# The configuration of client.py.

application:
  name: configuration-client

registries:
  zookeeper:
    address: zookeeper://127.0.0.1:2181

# Defaults for every service this application calls.
consumer:
  # Further attempts on other providers after a provider cannot take a call.
  retries: 1
  # How a provider is chosen for each call.
  loadbalance: roundrobin
  # Settings of one reference, by the name of its service, over the defaults.
  references:
    org.apache.dubbo.samples.Greeter:
      methods:
        greet_slowly:
          # A slow call is not worth repeating elsewhere.
          retries: 0
