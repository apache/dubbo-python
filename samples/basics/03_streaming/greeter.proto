syntax = "proto3";

package org.apache.dubbo.samples;

// Greets people in three streaming styles.
service StreamGreeter {
  // Server streaming: one request, many replies.
  rpc GreetManyTimes (HelloRequest) returns (stream HelloReply);
  // Client streaming: many requests, one reply.
  rpc GreetEveryone (stream HelloRequest) returns (HelloReply);
  // Bidirectional streaming: requests and replies flow both ways.
  rpc Chat (stream HelloRequest) returns (stream HelloReply);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
