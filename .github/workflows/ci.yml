name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv lock --check
      - run: uv sync --locked --all-extras
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync ty check

  license:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: apache/skywalking-eyes/header@a196742f472feaffafea537ce5a2a4c3c53a8de4 # v0.9.0
        with:
          mode: check

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      # The type group brings ty, which a test of the extension types runs.
      - run: uv sync --locked --all-extras --no-dev --group test --group type
      - run: uv run --no-sync pytest tests/unit tests/integration -m "not zookeeper and not nacos and not samples"

  install:
    name: default install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - run: uv sync --locked --no-dev --no-default-groups
      - run: uv run --no-sync python scripts/check_install.py

  integration:
    name: integration (Python ${{ matrix.python }}, ZooKeeper ${{ matrix.zookeeper }}, Nacos ${{ matrix.nacos }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each pair takes the oldest or the newest of the supported releases, so two jobs cover both ends.
        include:
          - { python: "3.11", zookeeper: 3.8.8, nacos: v2.4.3 }
          - { python: "3.14", zookeeper: 3.9.7, nacos: v2.5.5 }
    env:
      ZOOKEEPER_TAG: ${{ matrix.zookeeper }}
      NACOS_TAG: ${{ matrix.nacos }}
      DUBBO_TEST_ZOOKEEPER: 127.0.0.1:2181
      DUBBO_TEST_NACOS: 127.0.0.1:8848
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: docker compose -f tests/integration/compose.yaml up -d --wait
      - run: uv sync --locked --all-extras --no-dev --group test
      - run: uv run --no-sync pytest tests/integration -m "zookeeper or nacos or samples"
      - if: failure()
        run: docker compose -f tests/integration/compose.yaml logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-logs-${{ matrix.python }}
          path: compose.log

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - name: The wheel and the sdist carry LICENSE and NOTICE
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            listing=$(python3 -c 'import sys, tarfile, zipfile; p = sys.argv[1]; print("\n".join(zipfile.ZipFile(p).namelist() if p.endswith(".whl") else tarfile.open(p).getnames()))' "$artifact")
            for name in LICENSE NOTICE; do
              grep -q "/$name$" <<< "$listing" || { echo "$artifact has no $name"; exit 1; }
            done
          done
      # shortcut: without --strict, which fails while the project declares no readme; add it with the README.
      - run: uvx twine check dist/*
