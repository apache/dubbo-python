header:
  license:
    spdx-id: Apache-2.0
    copyright-owner: Apache Software Foundation
  paths-ignore:
    - LICENSE
    - NOTICE
    - uv.lock
    - dist
    - "**/*.md"
    - "**/py.typed"
    - .python-version
    # Generated, and the gRPC and googleapis definitions they come from.
    - "src/dubbo/_proto/**/*_pb2.py"
    - "src/dubbo/_proto/**/*_pb2.pyi"
    - "src/dubbo/_proto/**/*_dubbo.py"
    - "src/dubbo/_proto/google/**"
    - "src/dubbo/_proto/grpc/**"
    - "benchmark/**/*_pb2.py"
    - "benchmark/**/*_pb2.pyi"
    - "benchmark/**/*.pb.go"
    - "benchmark/**/*.triple.go"
    - "benchmark/**/go.sum"
    - "samples/**/*_pb2.py"
    - "samples/**/*_pb2.pyi"
    - "samples/**/*_pb2_grpc.py"
    - "samples/**/*_dubbo.py"
    - "samples/**/*.pb.go"
    - "samples/**/*.triple.go"
    - "samples/**/go.sum"
    - "tests/certificates/**"
    - "tests/**/data/**"
  comment: on-failure
