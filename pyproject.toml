[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "apache-dubbo"
version = "3.0.0b2"
description = "Python-native microservice RPC framework for Apache Dubbo"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Apache Dubbo Community", email = "dev@dubbo.apache.org" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["dubbo", "microservices", "rpc", "service-discovery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
# An upper bound only where the next major or minor release may break what is used.
dependencies = [
    "anyio>=4.14,<5",
    "attrs>=26.1",
    "cattrs>=26.1",
    "hessian2>=0.2,<0.3",
    "multidict>=7.2",
    "ngh2>=0.5,<0.6",
    "protobuf>=7.36,<8",
    "psutil>=7",
]

[project.optional-dependencies]
# The rules that registries and configuration centers deliver are YAML.
zookeeper = ["kazoo>=2.11", "apache-dubbo[yaml]"]
nacos = ["nacos-sdk-python>=3.2,<4", "apache-dubbo[yaml]"]
yaml = ["PyYAML>=6"]
properties = ["dotproperties>=0.2,<0.3"]
uvloop = ["uvloop>=0.22,<1; sys_platform != 'win32'"]
protoc = ["grpcio-tools>=1.85"]

[project.urls]
Homepage = "https://dubbo.apache.org/"
Documentation = "https://dubbo.apache.org/en/overview/mannual/python-sdk/"
Repository = "https://github.com/apache/dubbo-python"
Issues = "https://github.com/apache/dubbo/issues"

[project.scripts]
protoc-gen-python-dubbo = "dubbo.protoc.plugin:main"

[project.entry-points."apache_dubbo.config.parser"]
json = "dubbo.config.parsers.json:JsonParser"
yaml = "dubbo.config.parsers.yaml:YamlParser"
yml = "dubbo.config.parsers.yaml:YamlParser"
properties = "dubbo.config.parsers.properties:PropertiesParser"

[project.entry-points."apache_dubbo.config_center"]
zookeeper = "dubbo.config_center.zookeeper:ZookeeperConfigCenter"
nacos = "dubbo.config_center.nacos:NacosConfigCenter"

[project.entry-points."apache_dubbo.interface_registry"]
zookeeper = "dubbo.registry.zookeeper:ZookeeperInterfaceRegistry"
nacos = "dubbo.registry.nacos:NacosInterfaceRegistry"

[project.entry-points."apache_dubbo.instance_registry"]
zookeeper = "dubbo.registry.zookeeper:ZookeeperInstanceRegistry"
nacos = "dubbo.registry.nacos:NacosInstanceRegistry"

[project.entry-points."apache_dubbo.metadata_report"]
zookeeper = "dubbo.metadata.report.zookeeper:ZookeeperMetadataReport"
nacos = "dubbo.metadata.report.nacos:NacosMetadataReport"

[project.entry-points."apache_dubbo.cluster"]
available = "dubbo.cluster.available:AvailableCluster"
broadcast = "dubbo.cluster.broadcast:BroadcastCluster"
failback = "dubbo.cluster.failback:FailbackCluster"
failfast = "dubbo.cluster.failfast:FailfastCluster"
failover = "dubbo.cluster.failover:FailoverCluster"
failsafe = "dubbo.cluster.failsafe:FailsafeCluster"
forking = "dubbo.cluster.forking:ForkingCluster"
zone-aware = "dubbo.cluster.zoneaware:ZoneAwareCluster"

[project.entry-points."apache_dubbo.loadbalance"]
consistenthash = "dubbo.cluster.loadbalance.consistenthash:ConsistentHashLoadBalance"
leastactive = "dubbo.cluster.loadbalance.leastactive:LeastActiveLoadBalance"
random = "dubbo.cluster.loadbalance.random:RandomLoadBalance"
roundrobin = "dubbo.cluster.loadbalance.roundrobin:RoundRobinLoadBalance"

[project.entry-points."apache_dubbo.router"]
condition = "dubbo.cluster.router.condition:ConditionRouter"
tag = "dubbo.cluster.router.tag:TagRouter"

[project.entry-points."apache_dubbo.protocol"]
dubbo = "dubbo.protocol.dubbo:DubboProtocol"
tri = "dubbo.protocol.triple:TripleProtocol"

[project.entry-points."apache_dubbo.serialization"]
hessian2 = "dubbo.serialization.hessian2:Hessian2Serialization"
protobuf = "dubbo.serialization.protobuf:ProtobufSerialization"

[project.entry-points."apache_dubbo.compression"]
bzip2 = "dubbo.compression.bzip2:Bzip2Compressor"
deflate = "dubbo.compression.deflate:DeflateCompressor"
gzip = "dubbo.compression.gzip:GzipCompressor"

[project.entry-points."apache_dubbo.transport.zookeeper"]
kazoo = "dubbo.transport.zookeeper.kazoo:KazooZookeeperClient"

[project.entry-points."apache_dubbo.transport.nacos.naming"]
sdk = "dubbo.transport.nacos.sdk:SdkNacosNamingClient"

[project.entry-points."apache_dubbo.transport.nacos.config"]
sdk = "dubbo.transport.nacos.sdk:SdkNacosConfigClient"

[project.entry-points."apache_dubbo.transport.h2.client"]
aio = "dubbo.transport.h2.aio:AioH2Client"

[project.entry-points."apache_dubbo.transport.h2.server"]
aio = "dubbo.transport.h2.aio:AioH2Server"

[dependency-groups]
# The benchmarks of benchmark/: the gRPC libraries they compare with, and what plots the results.
benchmark = [{ include-group = "grpc" }, "altair>=6.3,<7", "grpclib>=0.4,<0.5", "vl-convert-python>=1.9,<2"]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "type" },
]
# grpcio, which the tests and the benchmarks call and serve gRPC with.
grpc = ["grpcio>=1.85,<2"]
lint = [
    "pre-commit>=4.6,<5",
    "ruff>=0.17,<0.18",
]
# Pinned, so that regenerating the modules of src/dubbo/_proto changes nothing else.
proto = ["grpcio-tools==1.85.0"]
test = [{ include-group = "grpc" }, "pytest>=9.1,<10"]
type = ["ty==0.0.104", "types-protobuf>=7.35,<8"]

[tool.hatch.build.targets.sdist]
only-include = ["src/dubbo"]

[tool.hatch.build.targets.wheel]
packages = ["src/dubbo"]

[tool.ruff]
line-length = 120
# Modules generated by protoc.
extend-exclude = ["**/*_pb2.py", "**/*_pb2.pyi", "**/*_pb2_grpc.py", "**/*_dubbo.py"]
force-exclude = true

[tool.ruff.lint]
select = [
    # pycodestyle: import, statement, and syntax errors.
    "E4",
    "E7",
    "E9",
    # Pyflakes: undefined names, unused imports, and related errors.
    "F",
    # isort: import grouping and ordering.
    "I",
    # pyupgrade: syntax supported by the minimum Python version.
    "UP",
    # flake8-bugbear: likely bugs and fragile patterns.
    "B",
    # flake8-comprehensions: unnecessary or suboptimal comprehensions.
    "C4",
    # flake8-simplify: unnecessarily complex expressions and control flow.
    "SIM",
    # flake8-pie: unnecessary code and avoidable patterns.
    "PIE",
    # Perflint: common Python performance anti-patterns.
    "PERF",
    # flake8-pytest-style: common pytest API misuse.
    "PT",
    # Ruff: native correctness and suppression checks.
    "RUF",
]

[tool.ty.src]
include = ["src"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest]
minversion = "9.1"
addopts = [
    "-ra", # Summarize every result except passed tests.
    "--import-mode=importlib", # Import tests without changing sys.path.
]
strict_config = true
strict_markers = true
markers = [
    "zookeeper: needs the ZooKeeper whose host:port DUBBO_TEST_ZOOKEEPER holds",
    "nacos: needs the Nacos whose host:port DUBBO_TEST_NACOS holds",
    "samples: runs a sample of samples/ as its README says",
    "real_clock: waits for a thread or a process, so it runs on the real clock instead of the virtual one",
]
strict_parametrization_ids = true
strict_xfail = true
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:v2.nacos", # The Nacos SDK declares pydantic models the deprecated way.
    # The Nacos SDK leaves the files of its local cache open.
    "ignore:Exception ignored (in.|while finalizing file) <_io.FileIO name='[^']*/nacos/cache/:pytest.PytestUnraisableExceptionWarning",
]
